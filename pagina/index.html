<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><title>Início</title>
<style>
html,body{margin:0;height:100%;background:#0f1420;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#top{display:flex;justify-content:space-between;align-items:flex-end;padding:40px 70px 10px}
#clock{font-size:84px;font-weight:bold}
#date{font-size:32px;color:#9aa4b8}
#grid{display:flex;flex-wrap:wrap;padding:20px 60px}
.t{display:block;box-sizing:border-box;width:23%;margin:1%;height:200px;border-radius:18px;color:#fff;text-decoration:none;padding:26px;position:relative;border:6px solid transparent}
.t.on,.t:hover{border-color:#fff;-webkit-transform:scale(1.06);transform:scale(1.06)}
.t b{font-size:72px;display:block;opacity:.9}
.t span{position:absolute;left:26px;bottom:22px;font-size:34px}
</style></head><body>
<div id="top"><div id="clock"></div><div id="date"></div></div>
<div id="grid"></div>
<script>
// Editar aqui: nome, endereço, cor. Na TV o browser usa cursor, por isso o realce segue o rato.
var TILES = [
 {n:"Google",    u:"http://www.google.com",    c:"#2b6cb0"},
 {n:"RTP Play",  u:"https://www.rtp.pt/play/", c:"#c53030"},
 {n:"Wikipedia", u:"https://pt.wikipedia.org", c:"#4a5568"},
 {n:"Meteo",     u:"https://www.ipma.pt",      c:"#2f855a"}
];
var COLS = 4, idx = 0, els = [];
var g = document.getElementById("grid");
function sel(n){ if (n < 0 || n >= els.length) return; els[idx].className = "t"; idx = n; els[idx].className = "t on"; }
for (var i = 0; i < TILES.length; i++) {
  var a = document.createElement("a");
  a.className = "t"; a.href = TILES[i].u; a.style.background = TILES[i].c;
  a.innerHTML = "<b>" + TILES[i].n.charAt(0) + "</b><span>" + TILES[i].n + "</span>";
  a.onmouseover = (function(n){ return function(){ sel(n); }; })(i);
  g.appendChild(a); els.push(a);
}
document.onkeydown = function (e) {
  var k = e.keyCode;
  if (k == 37) sel(idx - 1); else if (k == 39) sel(idx + 1);
  else if (k == 38) sel(idx - COLS); else if (k == 40) sel(idx + COLS);
  else if (k == 13) { location.href = TILES[idx].u; } else return;
  e.preventDefault();
};
function tick() {
  var d = new Date(), p = function (x) { return (x < 10 ? "0" : "") + x; };
  document.getElementById("clock").innerHTML = p(d.getHours()) + ":" + p(d.getMinutes());
  var D = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  var M = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  document.getElementById("date").innerHTML = D[d.getDay()] + ", " + d.getDate() + " de " + M[d.getMonth()];
}
tick(); setInterval(tick, 10000); sel(0);
</script></body></html>
