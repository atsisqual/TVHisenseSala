<!doctype html>
<html><head><meta charset="utf-8"><title>Início</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05070d;color:#fff;font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;cursor:none}
.abs{position:absolute}
#bgs div{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .7s ease}
#bgs div.on{opacity:1}
#shade{position:absolute;left:0;top:0;width:100%;height:100%;
 background:linear-gradient(90deg,rgba(5,7,13,.78) 0%,rgba(5,7,13,.35) 55%,rgba(5,7,13,.1) 100%),
            linear-gradient(0deg,rgba(5,7,13,.95) 0%,rgba(5,7,13,.55) 32%,rgba(5,7,13,0) 60%)}
#ghost{position:absolute;right:4vw;top:9vh;width:34vw;height:34vw;opacity:.16;transition:opacity .25s}
#top{position:absolute;left:5vw;right:5vw;top:4.5vh}
#hello{font-size:1.9vw;color:rgba(255,255,255,.72);letter-spacing:.05vw}
#clock{position:absolute;right:0;top:-.6vh;font-size:3.6vw;font-weight:300;letter-spacing:.1vw}
#date{position:absolute;right:.2vw;top:5.6vh;font-size:1.5vw;color:rgba(255,255,255,.6);text-align:right}
#hero{position:absolute;left:5vw;top:24vh;width:52vw;transition:opacity .16s ease,transform .16s ease}
#hero.out{opacity:0;transform:translateX(-1.2vw)}
#htag{font-size:1.4vw;letter-spacing:.35vw;color:rgba(255,255,255,.65);text-transform:uppercase}
#hname{font-size:6.6vw;font-weight:700;line-height:1.05;margin-top:1.2vh;letter-spacing:-.1vw}
#hsub{font-size:1.9vw;color:rgba(255,255,255,.78);margin-top:1.6vh;line-height:1.35}
#hbtn{display:inline-block;margin-top:3.6vh;padding:1.2vw 3.4vw;border-radius:5vw;background:#fff;color:#0a0d16;font-size:1.8vw;font-weight:700;box-shadow:0 .8vw 3vw rgba(0,0,0,.45)}
#rowt{position:absolute;left:5vw;top:63vh;font-size:1.5vw;color:rgba(255,255,255,.7);font-weight:600}
#row{position:absolute;left:4.2vw;top:68vh;white-space:nowrap}
.t{display:inline-block;vertical-align:top;width:13.2vw;margin:0 .9vw;text-align:center;transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.t .card{position:relative;width:100%;height:7.4vw;border-radius:1vw;overflow:hidden;
 box-shadow:0 .5vw 1.6vw rgba(0,0,0,.55);transition:box-shadow .18s,transform .18s cubic-bezier(.2,.8,.3,1)}
.t .card svg{position:absolute;left:50%;top:50%;width:3.9vw;height:3.9vw;margin:-1.95vw 0 0 -1.95vw}
.t .card:after{content:"";position:absolute;left:0;top:0;width:100%;height:100%;
 background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.18) 100%)}
.t .lb{margin-top:1.1vh;font-size:1.35vw;color:rgba(255,255,255,.55);transition:color .18s}
.t.f{z-index:3}
.t.f .card{transform:scale(1.16);box-shadow:0 0 0 .22vw #fff,0 1.2vw 3.4vw rgba(0,0,0,.7),0 0 4vw var(--glow)}
.t.f .lb{color:#fff;font-weight:600}
#hint{position:absolute;left:5vw;bottom:3.2vh;font-size:1.25vw;color:rgba(255,255,255,.4)}
#load{position:absolute;left:0;top:0;width:100%;height:100%;background:rgba(5,7,13,.82);display:none;text-align:center}
#load .sp{margin:36vh auto 0;width:5vw;height:5vw;border:.5vw solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:rot .9s linear infinite}
#load .tx{margin-top:3vh;font-size:2.2vw}
#err{position:absolute;left:5vw;bottom:7vh;font-size:1.6vw;color:#ffb347}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(2.5vh)}to{opacity:1;transform:none}}
.in{animation:up .6s ease both}
</style></head><body>
<div id="bgs"></div><div id="shade"></div><div id="ghost"></div>
<div id="top"><div id="hello"></div><div id="clock"></div><div id="date"></div></div>
<div id="hero" class="in"><div id="htag"></div><div id="hname"></div><div id="hsub"></div><div id="hbtn">Abrir</div></div>
<div id="rowt" class="in">As tuas apps</div><div id="row" class="in"></div>
<div id="hint">◄ ► navegar &nbsp;&nbsp; OK abrir</div>
<div id="err"></div>
<div id="load"><div class="sp"></div><div class="tx" id="ltx"></div></div>
<script>
/* ===== CONFIGURAÇÃO: editar aqui para mudar ou acrescentar mosaicos =====
   n=nome, k=APPNAME no launcher (apps nativas) OU url=endereço http (abre no browser)
   c=cor, g=cor do brilho, ic=ícone (netflix,play,dm,sun,game,globe), sub=descrição */
var TV='192.168.1.85:9223';
var TILES=[
 {n:'Netflix',     k:'NETFLIX',     c:'#c40a16',g:'rgba(229,9,20,.7)',  ic:'netflix',tag:'Séries e filmes',  sub:'Os teus filmes e séries favoritos.'},
 {n:'YouTube',     k:'YOUTUBE',     c:'#d81f1f',g:'rgba(255,40,40,.65)',ic:'play',   tag:'Vídeos',           sub:'Vídeos, música e canais que segues.'},
 {n:'Dailymotion', k:'DAILYMOTION', c:'#0a5bd6',g:'rgba(40,120,255,.7)',ic:'dm',     tag:'Vídeos',           sub:'Vídeos de todo o mundo.'},
 {n:'Meteorologia',k:'ACCUWEATHER', c:'#1b8a5c',g:'rgba(40,200,130,.6)',ic:'sun',    tag:'Tempo',            sub:'Previsão do tempo para a tua zona.'},
 {n:'Jogos',       k:'GAMECENTER',  c:'#6a3fcf',g:'rgba(150,100,255,.65)',ic:'game', tag:'Entretenimento',   sub:'Jogos para toda a família.'},
 {n:'Browser',     k:'TVBROWSER',   c:'#2271c4',g:'rgba(60,150,255,.65)',ic:'globe', tag:'Internet',         sub:'Navega na internet na TV.'}
];
/* ====================================================================== */
function ICON(t,bg){
 var s='<svg viewBox="0 0 48 48" fill="#fff" stroke="none">';
 if(t=='netflix')s+='<path d="M12 5h8l12 25V5h8v38h-8L20 18v25h-8z"/>';
 else if(t=='play')s+='<rect x="3" y="10" width="42" height="28" rx="9"/><path d="M19 17l12 7-12 7z" fill="'+bg+'"/>';
 else if(t=='dm')s+='<path fill-rule="evenodd" d="M34 5v38h-7v-4.4A13 13 0 1 1 27 17.4V5zM20 20.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15z"/>';
 else if(t=='sun')s+='<circle cx="24" cy="24" r="8.5"/><g stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/></g>';
 else if(t=='game')s+='<rect x="3" y="12" width="42" height="24" rx="12"/><path d="M13 20h3v3h3v3h-3v3h-3v-3h-3v-3h3z" fill="'+bg+'"/><circle cx="31" cy="21" r="2.4" fill="'+bg+'"/><circle cx="37" cy="27" r="2.4" fill="'+bg+'"/>';
 else s+='<g fill="none" stroke="#fff" stroke-width="3"><circle cx="24" cy="24" r="18"/><ellipse cx="24" cy="24" rx="8" ry="18"/><path d="M6 24h36M9 14h30M9 34h30"/></g>';
 return s+'</svg>';
}
function $(i){return document.getElementById(i)}
var cur=0,busy=false,errT=null,heroT=null;
function build(){
 var bg='',row='';
 for(var i=0;i<TILES.length;i++){var t=TILES[i];
  bg+='<div id="bg'+i+'" style="background:radial-gradient(120% 90% at 78% 12%,'+t.c+' 0%,'+shade(t.c)+' 55%,#05070d 100%)"></div>';
  row+='<div class="t" id="t'+i+'" style="--glow:'+t.g+'"><div class="card" style="background:'+t.c+'">'+ICON(t.ic,t.c)+'</div><div class="lb">'+t.n+'</div></div>';}
 $('bgs').innerHTML=bg;$('row').innerHTML=row;show(true);
}
function shade(h){var n=parseInt(h.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
 return 'rgb('+Math.round(r*.28)+','+Math.round(g*.28)+','+Math.round(b*.28)+')'}
function show(first){
 for(var i=0;i<TILES.length;i++){$('t'+i).className='t'+(i==cur?' f':'');$('bg'+i).className=i==cur?'on':''}
 var t=TILES[cur];
 var apply=function(){$('htag').innerHTML=t.tag;$('hname').innerHTML=t.n;$('hsub').innerHTML=t.sub;
  $('ghost').innerHTML=ICON(t.ic,t.c).replace('<svg','<svg width="100%" height="100%"');$('hero').className='';};
 if(first){apply();return}
 clearTimeout(heroT);$('hero').className='out';heroT=setTimeout(apply,150);
}
function aviso(s){$('err').innerHTML=s;clearTimeout(errT);errT=setTimeout(function(){$('err').innerHTML=''},5000)}
function fim(){busy=false;$('load').style.display='none'}
function abrir(){
 if(busy)return;var t=TILES[cur];
 if(t.url){location.href=t.url;return}
 busy=true;$('ltx').innerHTML='A abrir '+t.n+'…';$('load').style.display='block';setTimeout(fim,7000);
 var x=new XMLHttpRequest();x.open('GET','http://'+TV+'/json',true);
 x.onerror=function(){fim();aviso('Sem ligação ao launcher da TV.')};
 x.onload=function(){try{
  var u=JSON.parse(x.responseText)[0].webSocketDebuggerUrl.replace(/^ws:\/\/[^\/]+/,'ws://'+TV);
  var w=new WebSocket(u);
  w.onopen=function(){w.send(JSON.stringify({id:1,method:'Runtime.evaluate',params:{returnByValue:true,
   expression:"UI.popAllModule(); startThirdPartyApp(APPNAME."+t.k+",APPNAME."+t.k+",CMDType.NATIVEAPP,CMDMethod.MENU,false); 'ok'"}}))};
  w.onmessage=function(){w.close()};
  w.onerror=function(){fim();aviso('Erro a falar com o launcher.')};
 }catch(e){fim();aviso('Erro: '+e.message)}};
 x.send();
}
document.addEventListener('keydown',function(e){
 var k=e.keyCode,m=true;
 if(busy&&k!=8){return}
 if(k==37){if(cur>0){cur--;show()}}
 else if(k==39){if(cur<TILES.length-1){cur++;show()}}
 else if(k==13){abrir()}
 else m=false;
 if(m)e.preventDefault();
},true);
document.addEventListener('visibilitychange',function(){if(!document.hidden)fim()});
window.addEventListener('focus',fim);
var D=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'],
 M=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function relogio(){var d=new Date(),p=function(n){return n<10?'0'+n:n},h=d.getHours();
 $('clock').innerHTML=p(h)+':'+p(d.getMinutes());
 $('date').innerHTML=D[d.getDay()]+', '+d.getDate()+' de '+M[d.getMonth()];
 $('hello').innerHTML=h<6?'Boa noite':h<13?'Bom dia':h<20?'Boa tarde':'Boa noite'}
relogio();setInterval(relogio,15000);build();
</script></body></html>
