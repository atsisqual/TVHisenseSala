<html><head><meta charset=utf-8></head><body style="margin:0;background:#101820;color:#fff;font:2.2vw monospace;padding:2vw">
<div>Teste v3: teclas + ligacao ao launcher (9223)</div>
<div id=a style="margin-top:1vw;color:#ffd24a">a ligar...</div>
<div id=k style="margin-top:1vw;color:#7fdc7f">teclas: (carrega no comando)</div>
<div id=r style="margin-top:1vw;color:#ff9a9a"></div>
<script>
var H='192.168.1.85:9223', wsUrl=null;
function $(i){return document.getElementById(i)}
function ligar(){
  try{
    var x=new XMLHttpRequest(); x.open('GET','http://'+H+'/json',true);
    x.onload=function(){try{var j=JSON.parse(x.responseText);wsUrl=j[0].webSocketDebuggerUrl;$('a').innerHTML='/json OK -> '+wsUrl.slice(-30)}catch(e){$('a').innerHTML='/json lido mas erro: '+e.message}};
    x.onerror=function(){$('a').innerHTML='/json BLOQUEADO (CORS/rede)'};
    x.send();
  }catch(e){$('a').innerHTML='ERRO '+e.message}
}
function lancar(expr){
  if(!wsUrl){$('r').innerHTML='sem wsUrl';return}
  try{
    var w=new WebSocket(wsUrl.replace(/^ws:\/\/[^\/]+/,'ws://'+H));
    w.onopen=function(){w.send(JSON.stringify({id:1,method:'Runtime.evaluate',params:{expression:expr,returnByValue:true}}))};
    w.onmessage=function(m){$('r').innerHTML='resposta: '+String(m.data).slice(0,120);w.close()};
    w.onerror=function(){$('r').innerHTML='WebSocket erro'};
  }catch(e){$('r').innerHTML='ERRO ws '+e.message}
}
var log=[],cnt=0;
function reg(e){cnt++;var c=e.keyCode||e.which;log.unshift(cnt+' '+e.type+' '+c);log=log.slice(0,5);$('k').innerHTML='teclas:<br>'+log.join('<br>');
 if(e.type=='keydown'&&c==13){lancar("UI.popAllModule(); startThirdPartyApp(APPNAME.YOUTUBE,APPNAME.YOUTUBE,CMDType.NATIVEAPP,CMDMethod.MENU,false); 'ok'")}}
document.addEventListener('keydown',reg,true);document.addEventListener('keyup',reg,true);
ligar();
</script></body></html>
